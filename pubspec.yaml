name: salon_mapa
description: Mapa interactivo de salones de fiestas cercanos
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # HTTP
  http: ^1.2.0

  # Localización
  geolocator: ^11.0.0

  # UI
  flutter_spinkit: ^5.2.0
  cached_network_image: ^3.3.0

  # Utilidades
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
